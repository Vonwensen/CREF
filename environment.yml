# Starting specification based on recovered installation notes.
# This environment has not been solved or installed as a clean environment.
name: cref
channels:
  - pytorch
  - nvidia
  - pyg
  - conda-forge
dependencies:
  - python=3.8
  - pytorch=1.13.1
  - pytorch-cuda=11.6
  - pyg=2.2
  - pytorch-scatter
  - pytorch-sparse
  - pytorch-cluster
  - rdkit=2022.03
  - openbabel
  - numpy
  - scipy
  - scikit-learn
  - numba
  - matplotlib
  - tqdm
  - pyyaml
  - easydict
  - python-lmdb
  - tensorboard
  - pip
  - pip:
      - vina==1.2.2
      - pdb2pqr
# Open Babel's obabel executable must be on PATH; Python bindings are not used.
# AutoDockTools_py3 supplies an external receptor-preparation script.
# SA scoring also needs RDKit's Contrib SA_Score/fpscores.pkl.gz resource.
